name: Deploy React + Spring Boot to Amazon Linux EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build React Frontend
        working-directory: ./react-frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
        run: |
          npm install
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot JAR
        working-directory: ./springboot-backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to Amazon Linux EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/ec2-user/deploy-temp/build"
          scp -i ~/.ssh/ec2_key.pem -r react-frontend/build/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/deploy-temp/build/
          scp -i ~/.ssh/ec2_key.pem springboot-backend/target/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/deploy-temp/app.jar
          scp -i ~/.ssh/ec2_key.pem nginx/fullstack.conf ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/deploy-temp/fullstack.conf

      - name: Deploy and Restart on Amazon Linux EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            if ! command -v java &> /dev/null; then
              sudo dnf install java-17-amazon-corretto -y || sudo yum install java-17-amazon-corretto -y
            fi

            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ec2-user/deploy-temp/build/* /usr/share/nginx/html/
            sudo chown -R nginx:nginx /usr/share/nginx/html

            mkdir -p /home/ec2-user/backend
            cp /home/ec2-user/deploy-temp/app.jar /home/ec2-user/backend/app.jar
            pkill -f 'app.jar' || true
            nohup java -jar /home/ec2-user/backend/app.jar > /home/ec2-user/backend/app.log 2>&1 &

            sudo cp /home/ec2-user/deploy-temp/fullstack.conf /etc/nginx/conf.d/fullstack.conf
            sudo nginx -t && sudo systemctl reload nginx

            rm -rf /home/ec2-user/deploy-temp
          EOF
