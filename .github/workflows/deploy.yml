name: Deploy React + Spring Boot to Amazon Linux EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build React Frontend
        working-directory: ./react-frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false
        run: |
          npm install
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot JAR
        working-directory: ./springboot-backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Copy files to Amazon Linux EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "react-frontend/build/*,springboot-backend/target/*.jar,nginx/fullstack.conf"
          target: "/home/ec2-user/deploy-temp"

      - name: Deploy and Restart on Amazon Linux EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure Java 17 is installed on Amazon Linux
            if ! command -v java &> /dev/null; then
              sudo dnf install java-17-amazon-corretto -y || sudo yum install java-17-amazon-corretto -y
            fi

            # Update React frontend files and set Nginx permissions
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ec2-user/deploy-temp/react-frontend/build/* /usr/share/nginx/html/
            sudo chown -R nginx:nginx /usr/share/nginx/html

            # Update and restart Spring Boot backend
            mkdir -p /home/ec2-user/backend
            cp /home/ec2-user/deploy-temp/springboot-backend/target/*.jar /home/ec2-user/backend/app.jar
            pkill -f 'app.jar' || true
            nohup java -jar /home/ec2-user/backend/app.jar > /home/ec2-user/backend/app.log 2>&1 &

            # Update and reload Nginx configuration
            sudo cp /home/ec2-user/deploy-temp/nginx/fullstack.conf /etc/nginx/conf.d/fullstack.conf
            sudo nginx -t && sudo systemctl reload nginx

            # Remove temporary deployment files
            rm -rf /home/ec2-user/deploy-temp
